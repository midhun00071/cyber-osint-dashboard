name: alpha-data-production

x-application-security: &application-security
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_BOOTSTRAP_USER:?POSTGRES_BOOTSTRAP_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER must be set}"
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_MIGRATION_USER: "${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER must be set}"
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_APP_SCHEMA: public
    secrets:
      - postgres_bootstrap_password
      - postgres_app_password
      - postgres_migration_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/10-provision-database-roles.sh:/docker-entrypoint-initdb.d/10-provision-database-roles.sh:ro
      - ./database/init/11-apply-database-grants.sql:/opt/alpha-data/database/11-apply-database-grants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *application-security
    image: "alpha-data-backend:${IMAGE_TAG:-p7-01}"
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Cyber OSINT Dashboard}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-5}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-30}"
      DATABASE_POOL_RECYCLE_SECONDS: "${DATABASE_POOL_RECYCLE_SECONDS:-1800}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      BACKEND_CORS_ALLOWED_ORIGINS: "${BACKEND_CORS_ALLOWED_ORIGINS:?BACKEND_CORS_ALLOWED_ORIGINS must be set}"
      BACKEND_TRUSTED_HOSTS: "${BACKEND_TRUSTED_HOSTS:?BACKEND_TRUSTED_HOSTS must be set}"
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_TTL_MINUTES: "${AUTH_SESSION_TTL_MINUTES:-60}"
      AUTH_SESSION_ABSOLUTE_TTL_MINUTES: "${AUTH_SESSION_ABSOLUTE_TTL_MINUTES:-480}"
      AUTH_MAX_ACTIVE_SESSIONS: "${AUTH_MAX_ACTIVE_SESSIONS:-5}"
      AUTH_LOGIN_FAILURE_LIMIT: "${AUTH_LOGIN_FAILURE_LIMIT:-5}"
      AUTH_LOGIN_FAILURE_WINDOW_SECONDS: "${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}"
      AUTH_LOGIN_BLOCK_SECONDS: "${AUTH_LOGIN_BLOCK_SECONDS:-900}"
      ENABLE_ADMIN_INGESTION: "false"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; from app.core.config import get_settings; request = urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host': get_settings().trusted_hosts_list[0]}); urllib.request.urlopen(request, timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application
      - database
    secrets:
      - postgres_app_password

  frontend:
    <<: *application-security
    image: "alpha-data-frontend:${IMAGE_TAG:-p7-01}"
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        APP_ENV: production
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL must be set}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application

  migrate:
    <<: *application-security
    image: "alpha-data-backend:${IMAGE_TAG:-p7-01}"
    profiles:
      - migration
    restart: "no"
    command:
      - alembic
      - -c
      - /app/alembic.ini
      - upgrade
      - head
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-5}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-30}"
      DATABASE_POOL_RECYCLE_SECONDS: "${DATABASE_POOL_RECYCLE_SECONDS:-1800}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      BACKEND_CORS_ALLOWED_ORIGINS: "${BACKEND_CORS_ALLOWED_ORIGINS:?BACKEND_CORS_ALLOWED_ORIGINS must be set}"
      BACKEND_TRUSTED_HOSTS: "${BACKEND_TRUSTED_HOSTS:?BACKEND_TRUSTED_HOSTS must be set}"
      AUTH_COOKIE_SECURE: "true"
      ENABLE_ADMIN_INGESTION: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    secrets:
      - postgres_migration_password

  prefect-server:
    <<: *application-security
    image: alpha-data-prefect:3.8.1-python3.13
    build:
      context: .
      dockerfile: prefect/Dockerfile
    user: "10001:10001"
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
    volumes:
      - prefect_data:/var/lib/prefect
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - orchestration

  prefect-worker:
    <<: *application-security
    image: alpha-data-prefect:3.8.1-python3.13
    build:
      context: .
      dockerfile: prefect/Dockerfile
    user: "10001:10001"
    restart: unless-stopped
    command:
      - prefect
      - worker
      - start
      - --pool
      - alpha-data-process
      - --type
      - process
      - --with-healthcheck
      - --create-pool-if-not-found
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-5}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-30}"
      DATABASE_POOL_RECYCLE_SECONDS: "${DATABASE_POOL_RECYCLE_SECONDS:-1800}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      BACKEND_CORS_ALLOWED_ORIGINS: "${BACKEND_CORS_ALLOWED_ORIGINS:?BACKEND_CORS_ALLOWED_ORIGINS must be set}"
      BACKEND_TRUSTED_HOSTS: "${BACKEND_TRUSTED_HOSTS:?BACKEND_TRUSTED_HOSTS must be set}"
      AUTH_COOKIE_SECURE: "true"
    depends_on:
      prefect-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - orchestration
      - database
    secrets:
      - postgres_app_password

volumes:
  postgres_data:
  prefect_data:

secrets:
  postgres_bootstrap_password:
    file: "${POSTGRES_BOOTSTRAP_PASSWORD_SECRET_FILE:?POSTGRES_BOOTSTRAP_PASSWORD_SECRET_FILE must be set}"
  postgres_app_password:
    file: "${POSTGRES_APP_PASSWORD_SECRET_FILE:?POSTGRES_APP_PASSWORD_SECRET_FILE must be set}"
  postgres_migration_password:
    file: "${POSTGRES_MIGRATION_PASSWORD_SECRET_FILE:?POSTGRES_MIGRATION_PASSWORD_SECRET_FILE must be set}"

networks:
  application:
    driver: bridge
  database:
    driver: bridge
    internal: true
  orchestration:
    driver: bridge
    internal: true
