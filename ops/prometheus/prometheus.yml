global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: alpha-data

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: alpha-data-backend
    metrics_path: /internal/metrics
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
