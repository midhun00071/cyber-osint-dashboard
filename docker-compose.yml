services:
  db:
    image: postgres:17-alpine
    container_name: alpha-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_data_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_data_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_data_user} -d ${POSTGRES_DB:-alpha_data_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alpha_data_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpha-data-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Cyber OSINT Dashboard}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alpha_data_user}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-alpha_data_db}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      NVD_API_KEY: ${NVD_API_KEY:-}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-30}
      ENABLE_ADMIN_INGESTION: ${ENABLE_ADMIN_INGESTION:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alpha_data_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alpha-data-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - alpha_data_network

volumes:
  postgres_data:

networks:
  alpha_data_network:
    driver: bridge
