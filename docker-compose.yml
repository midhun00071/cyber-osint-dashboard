services:
  db:
    image: postgres:17-alpine
    container_name: alpha-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-alpha_data_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD must be set for local Compose}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_data_db}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-alpha_data_runtime}
      POSTGRES_LEGACY_USER: ${POSTGRES_LEGACY_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local Compose}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-alpha_data_migration}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set for local Compose}
      POSTGRES_APP_SCHEMA: public
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/10-provision-database-roles-entrypoint.sh:/docker-entrypoint-initdb.d/10-provision-database-roles.sh:ro
      - ./database/init/10-provision-database-roles.sh:/opt/alpha-data/database/10-provision-database-roles.sh:ro
      - ./database/init/11-apply-database-grants.sql:/opt/alpha-data/database/11-apply-database-grants.sql:ro
      - ./database/apply-runtime-grants.sh:/opt/alpha-data/database/apply-runtime-grants.sh:ro
      - ./database/reconcile-local-database-roles.sh:/opt/alpha-data/database/reconcile-local-database-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-alpha_data_bootstrap} -d ${POSTGRES_DB:-alpha_data_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alpha_data_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpha-data-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Cyber Sentinel}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alpha_data_db}
      POSTGRES_USER: ${POSTGRES_APP_USER:-alpha_data_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local Compose}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BACKEND_TRUSTED_HOSTS: ${BACKEND_TRUSTED_HOSTS:-localhost,127.0.0.1,[::1],testserver}
      NVD_API_KEY: ${NVD_API_KEY:-}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-30}
      ENABLE_ADMIN_INGESTION: ${ENABLE_ADMIN_INGESTION:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alpha_data_network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - migration
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      APP_ENV: local
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alpha_data_db}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-alpha_data_migration}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set for local Compose}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BACKEND_TRUSTED_HOSTS: ${BACKEND_TRUSTED_HOSTS:-localhost,127.0.0.1,[::1],testserver}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alpha_data_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_ENV: local
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    container_name: alpha-data-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - alpha_data_network

  prefect-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect_bootstrap
      POSTGRES_PASSWORD: ${PREFECT_METADATA_ADMIN_PASSWORD:-local-prefect-bootstrap-change-me}
      POSTGRES_DB: postgres
      PREFECT_RUNTIME_USER: prefect_runtime
      PREFECT_RUNTIME_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-local-prefect-change-me}
      PREFECT_RUNTIME_DB: prefect
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
      - ./prefect/database/init/10-provision-runtime-role.sh:/docker-entrypoint-initdb.d/10-provision-runtime-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${PREFECT_RUNTIME_PASSWORD}"
          psql --no-psqlrc --username "$${PREFECT_RUNTIME_USER}"
          --dbname "$${PREFECT_RUNTIME_DB}" --tuples-only --no-align
          --command 'SELECT 1' | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - prefect_metadata_network

  prefect-server:
    image: alpha-data-prefect:3.8.1-python3.13
    build:
      context: .
      dockerfile: prefect/Dockerfile
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-4200}/api
      PREFECT_SERVER_UI_STATIC_DIRECTORY: /var/lib/prefect/ui
      PREFECT_SERVER_DATABASE_DRIVER: postgresql+asyncpg
      PREFECT_SERVER_DATABASE_HOST: prefect-db
      PREFECT_SERVER_DATABASE_PORT: 5432
      PREFECT_SERVER_DATABASE_USER: prefect_runtime
      PREFECT_SERVER_DATABASE_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-local-prefect-change-me}
      PREFECT_SERVER_DATABASE_NAME: prefect
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/var/lib/prefect
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
      - alpha_data_network
      - prefect_metadata_network

  prefect-worker:
    image: alpha-data-prefect:3.8.1-python3.13
    build:
      context: .
      dockerfile: prefect/Dockerfile
    restart: unless-stopped
    command:
      - prefect
      - worker
      - start
      - --pool
      - alpha-data-process
      - --type
      - process
      - --with-healthcheck
      - --create-pool-if-not-found
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_ENV: local
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alpha_data_db}
      POSTGRES_USER: ${POSTGRES_APP_USER:-alpha_data_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local Compose}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
    depends_on:
      prefect-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - alpha_data_network

volumes:
  postgres_data:
  prefect_data:
  prefect_postgres_data:

networks:
  alpha_data_network:
    driver: bridge
  prefect_metadata_network:
    driver: bridge
    internal: true
